name: Publish to npm

env:
  GH_TOKEN: ${{ github.token }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.2.22). Required when re-running manually.'
        required: true
        type: string

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # workflow_dispatch defaults $GITHUB_REF_NAME to the default branch
      # (master), which would otherwise make downstream steps create a
      # `master` tag/release. Resolve the real tag from dispatch input and
      # check it out so the build + publish + changelog all operate on the
      # actual released commit (matters when the tag lives on an archived
      # v*.x branch rather than master).
      - name: Resolve release tag
        id: resolve-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ inputs.tag }}"
            if ! git rev-parse "$INPUT_TAG" >/dev/null 2>&1; then
              echo "::error::Tag '$INPUT_TAG' does not exist on the remote. Push the tag first, then re-dispatch."
              exit 1
            fi
            TAG="$INPUT_TAG"
            git checkout "$TAG"
          else
            # Tag push — actions/checkout already placed us on the tag.
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Because GitHub & NPM can't figure out their shit
      - name: Update NPM
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun dev:build

      - name: Determine npm tag
        id: npm-tag
        run: |
          TAG="${{ steps.resolve-tag.outputs.tag }}"
          VERSION="${TAG#v}"
          # Find which (if any) release branch this tag lives on.
          # Workflow triggers on tag push — branch info isn't in GITHUB_REF.
          RELEASE_BRANCH=$(git branch -r --contains "$TAG" | grep -E 'origin/v[0-9]+\.[0-9]+\.x$' | head -n1 | sed 's|origin/||' || true)

          if [ -n "$RELEASE_BRANCH" ]; then
            # Tag is on an archived v*.x branch — publish to a per-minor
            # dist-tag (e.g. sandstone-1-0) so `latest` stays pristine.
            # The shape is `<pkg-name>-<major>-<minor>` rather than the
            # more obvious `v<M>.<m>` because npm rejects any tag name
            # that parses as a SemVer range (see scripts/link.ts).
            MINOR_NUM="${VERSION#*.}"; MINOR_NUM="${MINOR_NUM%%.*}"
            echo "tag=sandstone-${VERSION%%.*}-${MINOR_NUM}" >> $GITHUB_OUTPUT
          else
            # Tag is on master → latest
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        run: npm publish --provenance --tag ${{ steps.npm-tag.outputs.tag }}

      - name: Prepare release metadata
        id: release
        run: |
          TAG="${{ steps.resolve-tag.outputs.tag }}"
          VERSION="${TAG#v}"

          # No prereleases are published (alpha/beta/rc dropped after major 1).
          echo "prerelease=false" >> $GITHUB_OUTPUT

          # Pick the most recent stable tag reachable from HEAD.
          # `--merged` is branch-aware: on v1.0.x this returns the last v1.0.x
          # tag (NOT v1.1.2 from master), so the release body / changelog
          # compare link only includes commits within the v1.0.x branch.
          PREV_TAG=$(git tag --sort=-v:refname --merged | grep -v "^${TAG}$" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          echo "prev_tag=${PREV_TAG}" >> $GITHUB_OUTPUT

          # Get commit message
          COMMIT_MSG=$(git log -1 --format=%B)
          COMMIT_TITLE=$(echo "$COMMIT_MSG" | head -n1)
          COMMIT_BODY=$(echo "$COMMIT_MSG" | tail -n +3)

          # Remove emoji prefix from title (e.g., "🐛 " or ":bug: ")
          CLEAN_TITLE=$(echo "$COMMIT_TITLE" | sed -E 's/^[^ ]+ //')

          # Release title: "<tag> - <clean title>"
          # Written to a file (not $GITHUB_OUTPUT) so backticks in the user's
          # title aren't lost when the title round-trips through GitHub
          # Actions' output interpolation into the next step's `--title`.
          echo "${TAG} - ${CLEAN_TITLE}" > release_title.txt

          # Build release body
          {
            # Commit message body if present
            if [[ -n "$COMMIT_BODY" ]]; then
              echo "$COMMIT_BODY"
              echo ""
            fi

            # Commits since previous tag in spoiler
            if [[ -n "$PREV_TAG" ]]; then
              echo "<details>"
              echo "<summary>Commits since ${PREV_TAG}</summary>"
              echo ""
              for COMMIT in $(git log --format="%H" "${PREV_TAG}..${TAG}"); do
                SUBJECT=$(git log -1 --format="%s" "$COMMIT")
                # Use %%aE (literal %aE) is wrong; embed AE via format.
                # Resolve GitHub login via API so @mention links correctly
                # even when the commit's author name differs from the login
                # (e.g. commits made via the github.com web editor use the
                # user's display name, not their handle).
                LOGIN=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT}" --jq '.author.login // empty')
                if [[ -z "$LOGIN" ]]; then
                  EMAIL=$(git log -1 --format="%ae" "$COMMIT")
                  LOGIN=$(gh api "search/users?q=${EMAIL}+in:email" --jq '.items[0].login // empty' 2>/dev/null || true)
                fi
                if [[ -n "$LOGIN" ]]; then
                  AUTHOR="@${LOGIN}"
                else
                  AUTHOR="@$(git log -1 --format="%an" "$COMMIT")"
                fi
                # Extract co-author names from trailers
                COAUTHORS=$(git log -1 --format="%(trailers:key=Co-authored-by,valueonly)" "$COMMIT" | sed -n 's/\(.*\) <.*/\1/p' | sed 's/^/, @/')
                echo "- $COMMIT $SUBJECT (${AUTHOR}${COAUTHORS})"
              done
              echo ""
              echo "</details>"
              echo ""
              echo "**Full Changelog**: [${PREV_TAG}...${TAG}](https://github.com/sandstone-mc/sandstone/compare/${PREV_TAG}...${TAG})"
            fi
          } > release_body.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Releases are always stable — no `--prerelease` flag (alpha/beta/rc
          # were dropped after major 1).
          #
          # Only the master tag is the GitHub "Latest" release. Patches on
          # archived v*.x branches release quietly so the master release
          # retains the prominent Latest marker on the GH Releases page.
          IS_RELEASE_BRANCH=$(git branch -r --contains "${{ steps.resolve-tag.outputs.tag }}" \
            | grep -E 'origin/v[0-9]+\.[0-9]+\.x$' | head -n1 || true)
          if [ -n "$IS_RELEASE_BRANCH" ]; then
            # Patches on archived v*.x branches release quietly — don't
            # steal the Latest badge from the master release.
            LATEST_FLAG="--latest=false"
          else
            # Master release is the headliner.
            LATEST_FLAG="--latest"
          fi

          gh release create "${{ steps.resolve-tag.outputs.tag }}" \
            --title "$(cat release_title.txt)" \
            --notes-file release_body.md \
            "$LATEST_FLAG"

      # Fetch the release payload via the GitHub API so the Discord action
      # receives the same raw name / body / url that a `release: published`
      # event would carry. The action handles its own formatting downstream
      # (whitespace, head reduction, mention links), so feeding it identical
      # raw input guarantees identical output regardless of how this workflow
      # was triggered (push tag, manual dispatch, or release event).
      - name: Fetch release payload
        id: release_payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.resolve-tag.outputs.tag }}" \
            --repo sandstone-mc/sandstone \
            --json name,body,url > release.json

          {
            echo "name<<EOF_NAME"
            jq -r .name release.json
            echo "EOF_NAME"
            echo "body<<EOF_BODY"
            jq -r .body release.json
            echo "EOF_BODY"
            echo "url<<EOF_URL"
            jq -r .url release.json
            echo "EOF_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: success()
        uses: SethCohen/github-releases-to-discord@v1
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          # Sandstone tan — `0xC2A878` = 12757112. Tweak to taste.
          color: 12757112
          username: "Sandstone"
          footer_title: Changelog
          reduce_headings: true
          footer_timestamp: true
          release_name: ${{ steps.release_payload.outputs.name }}
          release_body: ${{ steps.release_payload.outputs.body }}
          release_html_url: ${{ steps.release_payload.outputs.url }}
