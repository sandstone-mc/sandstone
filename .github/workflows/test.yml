name: Test

on:
  push:
  pull_request:
    branches: [ master ]

jobs:
  run_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
          fetch-depth: 0

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: bun i

    - name: Run tests
      run: bun test
